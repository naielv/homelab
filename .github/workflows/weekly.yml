# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tareas Semanales

on:
  workflow_dispatch:
  schedule:
  - cron: '14 3 * * 6'

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64,linux/amd64
  configure:
    name: Configurar el servidor
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4 
    - name: Actualizar el repositorio
      uses: tiyee/action-ssh@v1.0.1
      with:
        host: dietpi
        port: 22
        username: root
        privateKey: ${{ secrets.PRIVATE_KEY }} 
        command: 'cd ~/homelab && git pull'
    - name: Action SSH
      id: action-ssh
      uses: tiyee/action-ssh@v1.0.1
      with:
        host: dietpi
        port: 22
        username: root
        privateKey: ${{ secrets.PRIVATE_KEY }} 
        command: 'cd ~/homelab && python3 tasks/accounts.py'
  backup:
    name: Iniciar las copias de seguridad
    runs-on: self-hosted
    needs: configure
    steps:
    - uses: actions/checkout@v4 
    - name: Action SSH
      id: action-ssh
      uses: tiyee/action-ssh@v1.0.1
      with:
        host: dietpi
        port: 22
        username: root
        privateKey: ${{ secrets.PRIVATE_KEY }} 
        command: 'cd ~/homelab && python3 tasks/backup.py'
