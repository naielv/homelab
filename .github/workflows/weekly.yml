# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tareas Semanales

on:
  workflow_dispatch:
  schedule:
  - cron: '14 3 * * 6'
  push:
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  configure:
    name: Configurar el servidor
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4 
    - name: Actualizar el repositorio
      uses: tiyee/action-ssh@v1.0.1
      with:
        host: dietpi
        port: 22
        username: root
        privateKey: ${{ secrets.PRIVATE_KEY }} 
        command: 'cd ~/homelab && git pull'
    - name: Configurar las cuentas
      uses: tiyee/action-ssh@v1.0.1
      with:
        host: dietpi
        port: 22
        username: root
        privateKey: ${{ secrets.PRIVATE_KEY }} 
        command: 'cd ~/homelab && python3 tasks/accounts.py'
    - name: Configurar los servicios
      uses: tiyee/action-ssh@v1.0.1
      with:
        host: dietpi
        port: 22
        username: root
        privateKey: ${{ secrets.PRIVATE_KEY }} 
        command: 'cd ~/homelab && python3 tasks/services.py'
  backup:
    name: Iniciar las copias de seguridad
    runs-on: self-hosted
    needs: configure
    steps:
    - uses: actions/checkout@v4 
    - name: Action SSH
      id: action-ssh
      uses: tiyee/action-ssh@v1.0.1
      with:
        host: dietpi
        port: 22
        username: root
        privateKey: ${{ secrets.PRIVATE_KEY }} 
        command: 'cd ~/homelab && python3 tasks/backup.py'
